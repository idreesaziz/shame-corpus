name: Reproduce published CPU results
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r analysis/requirements.txt
      - name: Verify inputs and reproduce every numerical table
        run: python reproduction/run.py all
